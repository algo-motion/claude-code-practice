<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tra Cứu AI — Tìm kiếm tài liệu nội bộ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6f2;--panel:#fffdfa;--sunk:#f2eee8;--ink:#1d1a17;--ink2:#57514a;--ink3:#857e75;--line:#e6e0d7;--line2:#efeae3;--acc:#d0662f;--acc-ink:#a64b1b;--acc-soft:#fbece2;--ok:#2c7650;--ok-soft:#e5f1e9;--bad:#b0392a;--bad-soft:#f8e5e1;--r:10px;--font:'Be Vietnam Pro',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--acc-ink)}a:hover{color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}button:disabled{cursor:not-allowed;opacity:.5}
input,textarea,select{font:inherit;color:inherit}h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:pretty}p{margin:0;text-wrap:pretty}
mark{background:var(--acc-soft);color:var(--acc-ink);padding:0 2px;border-radius:3px;font-weight:500}
.muted{color:var(--ink2)}.sm{font-size:13px}.mono{font-family:var(--mono);font-size:12px}.grow,.grow1{flex:1;min-width:0}.w100{width:100%}.w120{width:120px;flex:none}.w160{width:170px;flex:none}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{display:flex;align-items:center;gap:8px}.ok{color:var(--ok)}.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-ghost{border:1px solid var(--line);background:var(--panel)}.btn-ghost:hover:not(:disabled){border-color:#cfc6ba;background:#fff}
.btn-primary{background:var(--acc);color:#fff}.btn-primary:hover:not(:disabled){background:var(--acc-ink)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover:not(:disabled){background:#3a352f}
.btn-soft{background:var(--acc-soft);color:var(--acc-ink)}.btn-soft:hover:not(:disabled){background:#f7dfd0}
.btn-lg{height:46px;font-size:15px}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink2)}.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:14px;color:var(--ink2);transition:.15s}.chip:hover{border-color:#cfc6ba;color:var(--ink)}.chip.sm{height:28px;padding:0 11px;font-size:13px}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.center{justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--acc-soft);color:var(--acc-ink)}
.typetag{flex:none;display:inline-grid;place-items:center;min-width:42px;height:22px;padding:0 6px;border-radius:5px;font:500 11px var(--mono);letter-spacing:.02em;background:var(--sunk);color:var(--ink2)}.t-pdf{background:#f7e4dc;color:#9b3d1a}.t-docx{background:#e2e9f3;color:#2f5481}.t-xlsx{background:#e1efe6;color:#2c6a47}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px;font-weight:600}
.ph{width:100%;border-radius:var(--r);border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--sunk) 0 10px,#ece7e0 10px 20px);display:grid;place-items:center}.ph span{font:12px var(--mono);color:var(--ink2);background:var(--panel);padding:4px 10px;border-radius:5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;flex:none}.spin.sm{width:10px;height:10px;border-width:1.5px}@keyframes sp{to{transform:rotate(1turn)}}
.caret{display:inline-block;width:7px;height:1em;background:var(--acc);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.skel{display:grid;gap:9px;padding:4px 0}.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sunk),#e9e3db,var(--sunk));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;gap:10px;align-items:baseline;margin:22px 0 10px}.label .mono{text-transform:none;letter-spacing:0;font-weight:400}
.field{display:grid;gap:6px;margin-bottom:16px}.field>span{font-size:13px;font-weight:500;color:var(--ink2)}.field input:not([type=range]),.input,.select{height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}.field input:focus,.input:focus,.select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}.field input.bad{border-color:var(--bad)}.field em{font-style:normal;font-size:13px;color:var(--bad)}.field.inline{margin:0;min-width:200px}.select{height:36px;width:auto;padding-right:8px}
input[type=range]{accent-color:var(--acc);width:100%}
/* brand */
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em}.brand b{color:var(--acc-ink);font-weight:700;margin-left:2px}.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--acc);position:relative;flex:none}.brand-mark:after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #fff}
/* shells */
.shell{display:flex;height:100vh}.main{flex:1;min-width:0;overflow:auto;position:relative}
.side{width:248px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:20px 14px;gap:2px}.side .brand{padding:0 8px 18px}.side-new{margin-bottom:14px;width:100%}
.side nav{display:grid;gap:2px}.side-item{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:14px;width:100%}.side-item:hover{background:var(--sunk);color:var(--ink)}.side-item.on{background:var(--acc-soft);color:var(--acc-ink)}.side-item.sm{height:34px;font-weight:400}.side-item .dot{width:6px;height:6px;border-radius:50%;background:var(--line);margin:0 6px}
.side-sec{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:20px 10px 6px}
.side-user{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line2)}.u-name{font-size:14px;font-weight:500}.u-sub{font-size:12px;color:var(--ink3)}.side-user>div{flex:1;min-width:0}
.shell-top{flex-direction:column}.topbar{height:64px;flex:none;display:flex;align-items:center;gap:36px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--panel)}.topnav{display:flex;gap:4px;flex:1}.topnav button{height:36px;padding:0 14px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:14px}.topnav button:hover{background:var(--sunk);color:var(--ink)}.topnav button.on{color:var(--ink);background:var(--sunk)}.me{display:flex;align-items:center;gap:8px}
.rail{width:76px;flex:none;background:var(--ink);color:#cfc7bc;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px}.rail .brand{padding-bottom:16px}.rail-item{width:62px;padding:9px 0 7px;border-radius:10px;display:grid;justify-items:center;gap:4px;font-size:11px}.rail-item:hover{background:#2e2a26;color:#fff}.rail-item.on{background:#3a342e;color:#fff}.rail-item.on svg{color:#f0a57d}.rail .avatar{background:var(--acc)}
/* pages */
.page{padding:40px 48px 64px;max-width:1180px;margin:0 auto}.page.narrow{max-width:860px}.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.page-h h2{font-size:26px}
.home{max-width:920px;padding-top:12vh}.home-hero{display:grid;gap:22px}.eyebrow{font-size:14px;font-weight:500;color:var(--acc-ink)}.home h1{font-size:38px;line-height:1.2;letter-spacing:-.025em;max-width:640px}
.home-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;margin-top:64px}.sec-h{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.list-plain{display:grid}.row-link{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 8px;margin:0 -8px;border-radius:8px;color:var(--ink);font-size:14px}.row-link:hover{background:var(--sunk)}.row-link svg{color:var(--ink3);flex:none}
.sbox{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 16px;border:1px solid var(--line);background:#fff;border-radius:12px;transition:border-color .15s,box-shadow .15s}.sbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}.sbox>svg{color:var(--ink3);flex:none}.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px}
.sbox.big{height:66px;border-radius:14px;padding-left:22px;box-shadow:0 1px 2px rgba(40,30,20,.04),0 8px 30px -12px rgba(40,30,20,.12)}.sbox.big input{font-size:17px}.sbox.big .btn{height:48px;padding:0 20px;border-radius:10px}
/* answer */
.answer{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:20px 22px;display:grid;gap:12px}.answer.hero{padding:28px 32px;border-color:#efd6c6;background:linear-gradient(180deg,#fdf4ee,var(--panel) 70%)}.answer.hero .answer-text{font-size:18px;line-height:1.7}
.answer-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ai-badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc-ink);font-size:12px;font-weight:600}.ai-badge.lg{height:32px;font-size:13px;padding:0 13px}
.answer-text{font-size:15px;line-height:1.75}.answer-text strong{font-weight:600}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 4px;margin:0 2px;border-radius:5px;background:var(--acc-soft);color:var(--acc-ink);font:600 11px var(--mono);vertical-align:2px;transition:.15s}button.cite:not(.static):hover{background:var(--acc);color:#fff}.cite.static{flex:none}
.sources{display:flex;flex-wrap:wrap;gap:8px}.source{display:flex;align-items:center;gap:8px;max-width:100%;height:34px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}.source:hover{border-color:var(--acc)}.src-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.answer-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line2)}
/* results */
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:20px 0 6px}.sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.result{display:grid;gap:6px;width:100%;padding:18px 16px;margin:0;border-radius:10px;border:1px solid transparent;transition:.15s}.result:hover{background:var(--panel);border-color:var(--line)}.result.on{background:var(--panel);border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.result.card{background:var(--panel);border-color:var(--line);padding:20px}.result.card:hover{border-color:#cfc6ba;transform:translateY(-1px)}
.result-top{display:flex;align-items:center;gap:10px}.result-t{font-weight:600;font-size:16px;letter-spacing:-.01em}.result-s{font-size:14px;color:var(--ink2);line-height:1.65}
.score{width:44px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden;flex:none}.score i{display:block;height:100%;background:var(--acc)}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}
.res-head{margin-bottom:18px}
.res-a{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);height:100%}.res-a .pane-main{overflow:auto;padding:28px 36px 48px}.res-a .pane-pv{overflow:auto;border-left:1px solid var(--line);background:var(--panel)}.rlist{display:grid;gap:2px;margin:0 -16px}
.res-b{max-width:1100px}.res-b .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:10px}
.res-c{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr) minmax(300px,380px);height:100%}.res-c .pane{overflow:auto}.res-c .pane-list{padding:22px 16px;border-right:1px solid var(--line)}.res-c .pane-list .filters{margin:0 0 8px}.res-c .pane-pv{background:var(--panel)}.res-c .pane-ai{padding:22px 18px;border-left:1px solid var(--line)}.res-c .pane-ai .answer{border:0;background:none;padding:0}.res-c .result{padding:14px 12px}.res-c .result-t{font-size:15px}
.drawer-bg{position:fixed;inset:0;background:rgba(29,26,23,.28);z-index:40;display:flex;justify-content:flex-end;animation:fd .2s}.drawer{width:min(560px,100%);height:100%;background:var(--panel);overflow:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.25);animation:sl .25s cubic-bezier(.2,.8,.2,1)}@keyframes fd{from{opacity:0}}@keyframes sl{from{transform:translateX(40px);opacity:.5}}
.preview{padding:26px 28px 40px}.preview.empty{height:100%;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--ink3)}
.pv-h{display:flex;gap:12px;align-items:flex-start}.pv-h .typetag{margin-top:3px}.pv-t{font-size:19px;font-weight:600;line-height:1.35;letter-spacing:-.015em}
.pv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pv-sum{margin-top:6px}.pv-sum .label{margin-top:20px}.sum-text{white-space:pre-line;font-size:14px;line-height:1.8;padding:14px 16px;background:var(--acc-soft);border-radius:10px;color:#4a2a17}
.pv-passage{border-left:2px solid var(--acc);padding:2px 0 2px 16px;display:grid;gap:8px;font-size:14px;line-height:1.7;color:var(--ink2)}.pv-passage .b{color:var(--ink);font-weight:600}
.pv-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:22px 0}.pv-meta div{background:var(--panel);padding:10px 14px;display:grid}.pv-meta span{font-size:12px;color:var(--ink3)}.pv-meta b{font-size:14px;font-weight:500}
/* chat */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;height:100%}.chat-list{border-right:1px solid var(--line);padding:20px 12px;overflow:auto;display:flex;flex-direction:column;gap:2px}.chat-list .side-sec{padding-top:18px}
.chat-main{display:flex;flex-direction:column;min-height:0;height:100%}.chat-scroll{flex:1;overflow:auto;padding:36px max(32px,calc((100% - 760px)/2)) 24px;display:flex;flex-direction:column;gap:26px}
.chat-empty{margin:auto;max-width:560px;text-align:center;display:grid;gap:14px;justify-items:center}.chat-empty h2{font-size:26px}
.msg{display:flex;gap:14px}.msg.u{justify-content:flex-end}.bubble{background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px 14px 4px 14px;max-width:75%;font-size:15px}
.ai-dot{width:30px;height:30px;flex:none;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center}.msg-tools{display:flex;gap:6px;margin-top:10px}
.composer{margin:0 max(32px,calc((100% - 760px)/2)) 24px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 12px 10px 16px;transition:.15s}.composer:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}.composer textarea{width:100%;border:0;outline:0;resize:none;background:none;font-size:15px}.composer-f{display:flex;align-items:center;gap:12px}.composer .select{max-width:240px;background:var(--bg)}
.chat-src{border-left:1px solid var(--line);padding:4px 18px 20px;overflow:auto;background:var(--panel);display:grid;align-content:start;gap:10px}.src-card{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}.src-card:hover{border-color:var(--acc)}.src-t2{font-weight:600;font-size:14px;line-height:1.4}
/* library / tables */
.drop{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:22px 24px;border:1.5px dashed #d7cdc0;border-radius:12px;background:var(--panel);cursor:pointer;transition:.15s}.drop:hover,.drop.on{border-color:var(--acc);background:var(--acc-soft)}.drop-ic{width:46px;height:46px;border-radius:12px;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;flex:none}.link{color:var(--acc-ink);font-weight:500;text-decoration:underline}
.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:28px 0 12px}.toolbar .input{max-width:280px;height:36px}
.table{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;margin-top:14px}.table.flat{border:0;border-radius:0;background:none;margin:0 -20px -6px}
.tr{display:flex;align-items:center;gap:16px;min-height:54px;padding:6px 20px;border-top:1px solid var(--line2);font-size:14px}.tr:first-child{border-top:0}.tr.th{min-height:40px;font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;background:var(--bg)}.tr.hov{cursor:pointer}.tr.hov:hover{background:#fff}.tr .row-link{margin:0;padding:0;min-height:0}.tr .row-link:hover{background:none;color:var(--acc-ink)}
.stage{display:grid;gap:5px}.bar{height:3px;border-radius:2px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .6s}
.table{overflow-x:auto}.table .tr{min-width:640px}.table .tr>.grow1{min-width:200px}.tr .mono.grow1,.tr .w160.muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table.flat .tr{min-width:600px}
.main{container-type:inline-size}@container (max-width:860px){.hide-sm{display:none!important}}
.empty-note{padding:40px;text-align:center;color:var(--ink3)}
/* admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px}.tabs button{padding:10px 14px;font-weight:500;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button:hover{color:var(--ink)}.tabs button.on{color:var(--ink);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:4px}.stat-v{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.card-h{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}
.bars{height:180px;display:flex;align-items:flex-end;gap:4px}.bars i{flex:1;background:#ecc6b0;border-radius:3px 3px 0 0;min-height:3px;transition:background .15s}.bars i:hover{background:var(--acc)}
.card .tr{padding:6px 0;min-height:44px}.card .table.flat .tr{padding:6px 20px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line2)}.cfg-row b{font-weight:500;font-size:14px}
.toggle{width:40px;height:24px;border-radius:99px;background:#d9d1c6;position:relative;flex:none;transition:.2s}.toggle i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}.toggle.on{background:var(--acc)}.toggle.on i{left:19px}
.save-bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
/* login */
.login{display:grid;grid-template-columns:minmax(380px,520px) 1fr;min-height:100vh}.login-card{padding:56px 64px;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:520px}.login-card h1{font-size:30px;margin-top:28px}.login-card form{display:grid}.login-side{padding:20px}.login-side .ph{height:100%}
.or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}.fine{font-size:12px;color:var(--ink3)}
@media (max-width:1100px){.res-a{grid-template-columns:1fr}.res-a .pane-pv{display:none}.res-c{grid-template-columns:minmax(260px,320px) 1fr}.res-c .pane-ai{display:none}.chat{grid-template-columns:200px 1fr}.chat-src{display:none}}
@media (max-width:760px){.side{display:none}.login{grid-template-columns:1fr}.login-side{display:none}.page{padding:28px 20px}.chat{grid-template-columns:1fr}.chat-list{display:none}.topnav{overflow:auto}}
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/search.jsx"></script>
<script type="text/babel" src="app/chat-library.jsx"></script>
<script type="text/babel" src="app/admin.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "layout": "Cổ điển",
  "role": "Quản trị viên",
  "accent": "#d0662f"
}/*EDITMODE-END*/;
const LAYOUTS={'Cổ điển':'sidebar','Trả lời trước':'topbar','Không gian':'rail'};
const ACCENTS={'#d0662f':['#a64b1b','#fbece2'],'#c2542f':['#9a3d1d','#f8e6df'],'#b8782a':['#8a5717','#f6ecdc']};
const KEY='tracuu-state';
function App(){
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
  const [authed,setAuthed]=useState(!!saved.authed);
  const [screen,setScreen]=useState(saved.screen||'search');
  const [query,setQuery]=useState(saved.query||'');
  const [chatSeed,setChatSeed]=useState(null);const [dept,setDept]=useState(null);const [drawer,setDrawer]=useState(null);
  const layout=LAYOUTS[t.layout]||'sidebar';
  const user={name:'Trần Minh Anh',initials:'MA',role:t.role==='Quản trị viên'?'admin':'staff',groups:t.role==='Quản trị viên'?['Tài chính','Admin']:['Tài chính']};
  useEffect(()=>{localStorage.setItem(KEY,JSON.stringify({authed,screen,query}))},[authed,screen,query]);
  useEffect(()=>{const a=ACCENTS[t.accent]||ACCENTS['#d0662f'];const s=document.documentElement.style;s.setProperty('--acc',t.accent);s.setProperty('--acc-ink',a[0]);s.setProperty('--acc-soft',a[1]);},[t.accent]);
  useEffect(()=>{if(screen==='admin'&&user.role!=='admin')setScreen('search')},[t.role]);
  function go(s,o={}){setDrawer(null);if(s==='chat')setChatSeed(o.newChat?null:chatSeed);if(s==='library')setDept(o.dept||null);setScreen(s);}
  const search=q=>{setQuery(q);setScreen('results')};
  const toChat=(q)=>{setDrawer(null);setChatSeed(q);setScreen('chat')};
  let body;
  if(screen==='results'&&query) body=<Results layout={layout} query={query} onSearch={search} onChat={toChat}/>;
  else if(screen==='chat') body=<Chat seed={chatSeed} openDoc={setDrawer}/>;
  else if(screen==='library') body=<Library openDoc={setDrawer} dept={dept}/>;
  else if(screen==='history') body=<History onSearch={search}/>;
  else if(screen==='admin') body=<Admin/>;
  else body=<SearchHome user={user} onSearch={search} openDoc={setDrawer}/>;
  return <>
    {!authed?<Login onLogin={()=>{setAuthed(true);setScreen('search')}}/>:
    <Shell layout={layout} screen={screen} go={go} user={user} onLogout={()=>setAuthed(false)}>
      <div key={screen+layout} style={{height:'100%'}}>{body}</div>
      {drawer&&<div className="drawer-bg" onClick={()=>setDrawer(null)}><div className="drawer" onClick={e=>e.stopPropagation()}><Preview d={drawer} onClose={()=>setDrawer(null)} onChat={toChat}/></div></div>}
    </Shell>}
    <TweaksPanel>
      <TweakSection label="Hướng bố cục"/>
      <TweakRadio label="Layout" value={t.layout} options={['Cổ điển','Trả lời trước','Không gian']} onChange={v=>setTweak('layout',v)}/>
      <TweakSection label="Phân quyền"/>
      <TweakRadio label="Vai trò" value={t.role} options={['Nhân viên','Quản trị viên']} onChange={v=>setTweak('role',v)}/>
      <TweakSection label="Màu nhấn"/>
      <TweakColor label="Accent" value={t.accent} options={Object.keys(ACCENTS)} onChange={v=>setTweak('accent',v)}/>
      <TweakSection label="Màn hình"/>
      <TweakButton label="Xem màn hình đăng nhập" onClick={()=>setAuthed(false)}/>
      <TweakButton label="Mở sơ đồ kiến trúc AWS" onClick={()=>window.open('Kien truc AWS.html','_blank')}/>
    </TweaksPanel>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
